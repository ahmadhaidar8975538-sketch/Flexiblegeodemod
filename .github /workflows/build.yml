name: Build Flexible Generator

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Geode mod
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64

      - uses: actions/upload-artifact@v4
        with:
          name: FlexibleGenerator-Android64
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
